[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezsql"
version = "0.2.0"
description = "AI-native SQL engineering MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "sqlglot>=30.17.0",
    "pydantic>=2.13.0",
    "structlog>=26.1.0",
    "litellm>=1.96.0",
    "sqlalchemy>=2.0.52",
    "httpx>=0.28.0",
    "asyncpg>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
ezsql = "ezsql.server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ezsql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

# asyncpg ships no py.typed marker or stubs; the adapter isolates it.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
