name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, type-check, test (no DB)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev deps)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src/ezsql

      # No EZSQL_TEST_DATABASE_URL set: integration tests skip and the
      # no-DB degradation path is proven by the unit/pipeline suites.
      - name: Pytest (no DB — honest degradation)
        run: pytest tests -q

  postgres-integration:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    needs: lint-type-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package (editable, with dev deps)
        run: pip install -e ".[dev]"

      - name: Provision isolated test database and least-privileged role
        run: |
          psql -U postgres -h localhost <<'SQL'
          -- Isolated test database (name matches the test-only pattern).
          CREATE DATABASE ezsql_test;

          -- Fixture tables and indexes.
          \connect ezsql_test
          CREATE TABLE ezsql_test_users (
            id INT PRIMARY KEY,
            email TEXT,
            name TEXT,
            non_indexed TEXT
          );
          CREATE INDEX ezsql_test_users_email_idx ON ezsql_test_users (email);
          INSERT INTO ezsql_test_users
            SELECT i, 'u' || i || '@example.com', 'user' || i, 'x'
            FROM generate_series(1, 1000) AS i;
          ANALYZE ezsql_test_users;

          -- Dedicated no-write role: CONNECT + USAGE + SELECT only.
          CREATE ROLE ezsql_explain_test LOGIN PASSWORD 'explain_test_pw';
          GRANT CONNECT ON DATABASE ezsql_test TO ezsql_explain_test;
          GRANT USAGE ON SCHEMA public TO ezsql_explain_test;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO ezsql_explain_test;

          -- Least privilege hardening: no TEMP, no CREATE for PUBLIC.
          REVOKE TEMP ON DATABASE ezsql_test FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON DATABASE ezsql_test FROM PUBLIC;
          SQL

      - name: Provision ephemeral TLS
        run: |
          # Ephemeral CA + server certificate for verified TLS.
          openssl req -new -x509 -days 1 -nodes \
            -keyout /tmp/ca.key -out /tmp/ca.crt \
            -subj "/CN=ezsql-test-ca"
          openssl req -new -nodes \
            -keyout /tmp/server.key -out /tmp/server.csr \
            -subj "/CN=localhost"
          openssl x509 -req -in /tmp/server.csr \
            -CA /tmp/ca.crt -CAkey /tmp/ca.key -CAcreateserial \
            -out /tmp/server.crt -days 1
          chmod 600 /tmp/server.key

          # Enable TLS on the running server (requires superuser + reload).
          sudo cp /tmp/server.crt /tmp/server.key /tmp/ca.crt /var/run/postgresql/ 2>/dev/null || true
          psql -U postgres -h localhost <<'SQL'
          ALTER SYSTEM SET ssl = on;
          ALTER SYSTEM SET ssl_cert_file = '/tmp/server.crt';
          ALTER SYSTEM SET ssl_key_file = '/tmp/server.key';
          ALTER SYSTEM SET ssl_ca_file = '/tmp/ca.crt';
          SELECT pg_reload_conf();
          SQL
          sleep 2

      - name: Pytest (integration runs, not skips)
        env:
          # Verified-TLS URI for the least-privileged role only.
          EZSQL_TEST_DATABASE_URL: "postgres://ezsql_explain_test:explain_test_pw@localhost:5432/ezsql_test?sslmode=verify-full&sslrootcert=/tmp/ca.crt"
        run: pytest tests -q

      - name: Prove integration tests executed
        run: |
          # The integration suite must RUN, not skip, in this job.
          pytest tests/pipelines/test_postgres_integration.py -q --no-header -rs | tee /tmp/integration.log
          if grep -q "8 skipped" /tmp/integration.log && ! grep -q "passed" /tmp/integration.log; then
            echo "ERROR: integration tests skipped — they must run in CI"; exit 1
          fi
